<style>

@media(max-width:800px),(pointer:coarse){.brand{left:14px;top:12px}.brand h1{font-size:35px;max-width:120px}.kicker{font-size:8px}.top-actions{display:none}.world-panel{top:auto;bottom:64px;left:10px;right:10px;width:auto;padding:8px;background:rgba(3,6,4,.95);border:1px solid rgba(255,255,255,.17);transform:translateY(calc(100% + 90px));transition:.25s}.world-panel.open{transform:none}.world-list{grid-template-columns:repeat(3,1fr)}.world-btn{height:48px;padding:5px 8px;font-size:10px}.formula-open{padding:12px 8px}.mobile-bar{display:grid;grid-template-columns:1.4fr repeat(3,1fr);position:fixed;z-index:30;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));height:48px;background:rgba(3,6,4,.9);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(14px)}.mobile-bar button{border:0;border-right:1px solid rgba(255,255,255,.12);background:transparent;font-size:10px;text-transform:uppercase}.mobile-bar button:first-child{color:var(--lime)}.hud{left:auto;right:8px;bottom:65px;transform:none;width:132px;height:48px;grid-template-columns:1fr 1fr}.hud.hidden{transform:translateY(140px)}.hud>div{display:none}.hud .fps,.hud .speed{display:flex;font-size:9px}.hud strong{font-size:14px}.settings{top:8px;right:8px;bottom:64px;width:min(320px,calc(100% - 16px))}.formula{inset:8px;padding:14px;overflow:auto}.formula p{font-size:10px;line-height:1.4}.presets{margin:10px 0}textarea{height:165px;padding:12px;font-size:12px}.joystick{display:block;position:fixed;left:24px;bottom:80px;width:108px;height:108px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.18);z-index:8;touch-action:none}.joystick i{position:absolute;left:34px;top:34px;width:40px;height:40px;border-radius:50%;border:1px solid var(--lime);background:rgba(207,255,68,.12)}.look-pad{display:block;position:fixed;right:0;top:0;width:58%;height:calc(100% - 60px);z-index:3;touch-action:none}}

</style></head><body><div class="app"><canvas id="gl"></canvas><div class="grain"></div><div class="brand"><div class="kicker">REALTIME FRACTAL NAVIGATOR · <span id="worldNo">01</span></div><h1>FRACTAL<br>DRIFT</h1></div><div class="cross"></div><div class="top-actions"><button id="panelBtn">Panel</button><button id="hudBtn">HUD</button><button id="fullBtn">Full</button></div><section class="world-panel" id="worldPanel"><div class="world-list" id="worldList"></div><button class="formula-open" id="formulaBtn">ƒ Custom Formula</button></section><aside class="settings" id="settings"><div class="panel-head"><strong>RENDER CONTROL</strong><button class="close" id="closeSettings">×</button></div><div class="row"><label>Speed <b id="speedVal">5.0</b></label><input id="speed" type="range" min="1" max="18" step=".5" value="5"></div><div class="row"><label>Render distance <b id="distVal">60</b></label><input id="distance" type="range" min="25" max="120" step="5" value="60"></div><div class="row"><label>Detail <b id="detailVal">96</b></label><input id="detail" type="range" min="48" max="160" step="8" value="96"></div><div class="row"><label>FOV <b id="fovVal">75</b></label><input id="fov" type="range" min="45" max="110" value="75"></div><div class="row toggle"><label>Glow</label><input id="glow" type="checkbox" checked></div><div class="row toggle"><label>Shadows</label><input id="shadows" type="checkbox" checked></div></aside><div class="hud" id="hud"><div><small>VELOCITY / <span id="fpsInline">60 FPS</span></small><span>REALTIME FIELD</span></div><div><small>[WASD]</small>MOVE</div><div><small>[MOUSE]</small>LOOK</div><div><small>[SHIFT]</small>BOOST</div><div><small>[F]</small>FORMULA</div><div class="fps"><small>FPS</small><strong id="fps">60</strong></div><div class="speed"><small>SPEED</small><strong id="speedHud">5.0</strong></div></div><div class="mobile-bar"><button id="mobileWorld">Worlds</button><button id="mobilePanel">Panel</button><button id="mobileHud">HUD</button><button id="mobileFull">Full</button></div><div class="joystick" id="joystick"><i id="stick"></i></div><div class="look-pad" id="lookPad"></div><section class="formula" id="formula"><div class="title"><span>ƒ / FIELD COMPILER</span><button class="close" id="closeFormula">CLOSE [ESC]</button></div><p>Write a signed-distance GLSL expression. Available: <b>p</b> (vec3), <b>t</b> (time), sin cos abs length mod min max dot.</p><div class="presets"><button data-code="length(p)-1.2">Sphere</button><button data-code="length(mod(p+2.0,4.0)-2.0)-0.72">Lattice</button><button data-code="length(p.xy)-0.65+sin(p.z*2.0+t)*0.18">Organic</button><button data-code="length(mod(p+1.5,3.0)-1.5)-0.45+sin(dot(p,p)*2.0+t)*0.12">Warp</button></div><textarea id="code">length(mod(p + 2.0, 4.0) - 2.0) - 0.72</textarea><div class="error" id="error"></div><div class="formula-actions"><button id="resetFormula">RESET</button><button class="compile" id="compile">COMPILE FIELD</button></div></section></div>
<script>
const V=`#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0,1);}`;const worlds=['MANDELBOX','LIMINAL','LATTICE','ORGANIC','∞ PIZZA','CATHEDRAL','MENGER','CRYSTAL','VOID RINGS'];let world=0,custom=false,customExpr='length(mod(p + 2.0, 4.0) - 2.0) - 0.72',pos=[0,0,-4],yaw=0,pitch=0,keys={},joy=[0,0],last=performance.now(),fps=60,program;const canvas=document.querySelector('#gl'),gl=canvas.getContext('webgl2',{antialias:false,powerPreference:'high-performance'}),$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function fieldCode(){if(custom)return `return ${customExpr};`;return [`vec3 z=p;float dr=1.,r=0.;for(int i=0;i<7;i++){z=clamp(z,-1.,1.)*2.-z;float r2=dot(z,z);float k=clamp(2./r2,.35,1.);z*=k;dr*=k;z=z*2.+p;r=length(z);}return r/abs(dr)-.035;`,`vec3 q=mod(p,vec3(8.,4.,8.))-vec3(4.,2.,4.);float room=max(abs(q.y)-1.75,min(abs(q.x)-3.6,abs(q.z)-3.6));float pillars=length(mod(p.xz+1.,2.)-1.)-.14;return min(room,pillars);`,`return length(mod(p+1.25,2.5)-1.25)-.38;`,`vec3 q=p;q.xy*=rot(sin(p.z*.3)*.7);return length(q.xy)-(.75+.18*sin(q.z*2.+uTime));`,`vec3 q=mod(p,vec3(4.,3.,5.))-vec3(2.,1.5,2.5);float crust=length(q.xy)-1.15;float top=max(length(q.xy)-1.02,q.z-.18);float cheese=max(top,-q.z-.02);float pep=length(vec2(length(q.xy)-.55,q.z-.25))-.18;return min(abs(crust)-.16,min(cheese,pep));`,`vec3 q=mod(p,vec3(7.,6.,7.))-vec3(3.5,3.,3.5);float nave=max(abs(q.x)-2.6,abs(q.y)-2.7);float ribs=abs(length(q.xy)-2.35)-.12;return min(nave,max(ribs,abs(q.z)-.18));`,`vec3 q=mod(p+1.5,3.)-1.5;float d=max(max(abs(q.x),abs(q.y)),abs(q.z))-.95;float h1=max(abs(q.x)-.28,abs(q.y)-.28);float h2=max(abs(q.y)-.28,abs(q.z)-.28);float h3=max(abs(q.x)-.28,abs(q.z)-.28);return max(d,-min(h1,min(h2,h3)));`,`vec3 q=mod(p+2.,4.)-2.;q.xy*=rot(.55);float oct=(abs(q.x)+abs(q.y)+abs(q.z))*.58-1.;return oct+.08*sin(dot(q,q)*8.+uTime);`,`vec3 q=p;float a=atan(q.z,q.x);float r=length(q.xz);return length(vec2(r-(2.+sin(a*6.+uTime)*.2),q.y))-.16;`][world]}
function shader(){return `#version 300 es\nprecision highp float;out vec4 o;uniform vec2 uRes;uniform float uTime,uFov,uDist,uGlow,uShadow;uniform int uSteps;uniform vec3 uCam;uniform vec2 uRot;mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}float map(vec3 p){${fieldCode()}}vec3 pal(float h){${world===4?'return mix(vec3(.95,.18,.03),vec3(1.,.78,.08),h);':world===1?'return mix(vec3(.55,.36,.12),vec3(.95,.72,.25),h);':'return .5+.5*cos(6.283*(vec3(.08,.21,.34)+h+vec3(0.,.12,.28)));'}}void main(){vec2 uv=(gl_FragCoord.xy*2.-uRes)/uRes.y;vec3 rd=normalize(vec3(uv*tan(radians(uFov)*.5),1.));rd.yz*=rot(uRot.y);rd.xz*=rot(uRot.x);float d=0.,g=0.;int i=0;for(;i<200;i++){if(i>=uSteps)break;vec3 p=uCam+rd*d;float h=map(p);g+=exp(-abs(h)*9.)*.014;if(abs(h)<.0015||d>uDist)break;d+=max(abs(h)*.68,.008);}vec3 col=vec3(.003,.006,.004);if(d<uDist){vec3 p=uCam+rd*d;vec2 e=vec2(.002,0);vec3 n=normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));float dif=max(dot(n,normalize(vec3(.5,.7,-.4))),0.);float sh=mix(1.,.28,uShadow*smoothstep(0.,.03,map(p+n*.03)));col=pal(float(i)*.018+p.z*.018)*(.13+dif*.9)*sh;col*=exp(-d*.018);}col+=uGlow*g*pal(uTime*.02);col=pow(col,vec3(.72));o=vec4(col,1.);}`}
function compile(){if(!gl)return;const cv=gl.createShader(gl.VERTEX_SHADER);gl.shaderSource(cv,V);gl.compileShader(cv);const cf=gl.createShader(gl.FRAGMENT_SHADER);gl.shaderSource(cf,shader());gl.compileShader(cf);if(!gl.getShaderParameter(cf,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(cf));const p=gl.createProgram();gl.attachShader(p,cv);gl.attachShader(p,cf);gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));if(program)gl.deleteProgram(program);program=p;gl.useProgram(program);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const a=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0)}
function resize(){const d=Math.min(devicePixelRatio,1.5),w=innerWidth,h=innerHeight;if(canvas.width!==w*d||canvas.height!==h*d){canvas.width=w*d;canvas.height=h*d;gl.viewport(0,0,canvas.width,canvas.height)}}function uni(n,v){const l=gl.getUniformLocation(program,n);Array.isArray(v)?(v.length===3?gl.uniform3fv(l,v):gl.uniform2fv(l,v)):Number.isInteger(v)?gl.uniform1i(l,v):gl.uniform1f(l,v)}
function loop(t){resize();let dt=Math.min((t-last)/1000,.05);last=t;fps=fps*.9+(1/dt)*.1;const sp=+$('#speed').value*(keys.ShiftLeft?3:1),f=[Math.sin(yaw),0,Math.cos(yaw)],r=[Math.cos(yaw),0,-Math.sin(yaw)];let fw=(keys.KeyW?1:0)-(keys.KeyS?1:0)-joy[1],sd=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy[0],up=(keys.Space?1:0)-(keys.ControlLeft?1:0);for(let i=0;i<3;i++)pos[i]+=(f[i]*fw+r[i]*sd)*sp*dt;pos[1]+=up*sp*dt;gl.useProgram(program);uni('uRes',[canvas.width,canvas.height]);uni('uTime',t/1000);uni('uCam',pos);uni('uRot',[yaw,pitch]);uni('uFov',+$('#fov').value);uni('uDist',+$('#distance').value);uni('uSteps',+$('#detail').value|0);uni('uGlow',$('#glow').checked?1:0);uni('uShadow',$('#shadows').checked?1:0);gl.drawArrays(gl.TRIANGLES,0,3);$('#fps').textContent=Math.round(fps);$('#fpsInline').textContent=Math.round(fps)+' FPS';$('#speedHud').textContent=sp.toFixed(1);requestAnimationFrame(loop)}
function selectWorld(i){world=i;custom=false;pos=[0,0,-4];compile();$$('.world-btn').forEach((b,j)=>b.classList.toggle('active',j===i));$('#worldNo').textContent=String(i+1).padStart(2,'0');if(matchMedia('(pointer:coarse)').matches)$('#worldPanel').classList.remove('open')}worlds.forEach((w,i)=>{const b=document.createElement('button');b.className='world-btn'+(i===0?' active':'');b.innerHTML=`<span>${String(i+1).padStart(2,'0')}</span>${w}`;b.onclick=()=>selectWorld(i);$('#worldList').append(b)});
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyF')$('#formula').classList.add('open');if(e.code==='Escape')$('#formula').classList.remove('open');if(/^Digit[1-9]$/.test(e.code))selectWorld(+e.code.slice(-1)-1)});addEventListener('keyup',e=>keys[e.code]=false);canvas.addEventListener('click',()=>{if(!matchMedia('(pointer:coarse)').matches)canvas.requestPointerLock()});addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas){yaw-=e.movementX*.0022;pitch=Math.max(-1.45,Math.min(1.45,pitch-e.movementY*.0022))}});const toggle=(id,c='open')=>$(id).classList.toggle(c);$('#panelBtn').onclick=$('#mobilePanel').onclick=()=>toggle('#settings');$('#hudBtn').onclick=$('#mobileHud').onclick=()=>toggle('#hud','hidden');$('#fullBtn').onclick=$('#mobileFull').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();$('#mobileWorld').onclick=()=>toggle('#worldPanel');$('#closeSettings').onclick=()=>$('#settings').classList.remove('open');$('#formulaBtn').onclick=()=>$('#formula').classList.add('open');$('#closeFormula').onclick=()=>$('#formula').classList.remove('open');$$('.presets button').forEach(b=>b.onclick=()=>$('#code').value=b.dataset.code);$('#resetFormula').onclick=()=>$('#code').value='length(mod(p + 2.0, 4.0) - 2.0) - 0.72';$('#compile').onclick=()=>{try{customExpr=$('#code').value.trim().replace(/;$/,'');if(/[{}#]/.test(customExpr))throw Error('Use one GLSL expression only.');custom=true;compile();$('#error').textContent='Compiled successfully.';$('#formula').classList.remove('open')}catch(e){$('#error').textContent=String(e.message).split('\n').slice(-2).join(' ')}};['speed','distance','detail','fov'].forEach(id=>$('#'+id).oninput=e=>$('#'+id+'Val').textContent=e.target.value);
function dragZone(el,cb){let id=null,x=0,y=0;el.addEventListener('pointerdown',e=>{id=e.pointerId;x=e.clientX;y=e.clientY;el.setPointerCapture(id);cb(0,0,true)});el.addEventListener('pointermove',e=>{if(e.pointerId===id)cb(e.clientX-x,e.clientY-y,false)});const up=e=>{if(e.pointerId===id){id=null;cb(0,0,true)}};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}dragZone($('#joystick'),(dx,dy,end)=>{if(end){joy=[0,0];$('#stick').style.transform='translate(0,0)';return}const m=36,l=Math.hypot(dx,dy)||1,k=Math.min(1,m/l),nx=dx*k,ny=dy*k;joy=[nx/m,ny/m];$('#stick').style.transform=`translate(${nx}px,${ny}px)`});dragZone($('#lookPad'),(dx,dy,end)=>{if(!end){yaw-=dx*.006;pitch=Math.max(-1.45,Math.min(1.45,pitch-dy*.006))}});try{compile();requestAnimationFrame(loop)}catch(e){document.body.innerHTML='<pre style="color:#cfff44;padding:20px">WebGL2 unavailable\n'+e.message+'</pre>'}
</script></body></html>
