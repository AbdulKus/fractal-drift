name: Build Fractal Drift for Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-source
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npx next build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - name: Publish the static export into the Pages branch source
        shell: bash
        run: |
          rm -rf _next 404 _not-found
          rm -f index.html index.txt 404.html .nojekyll __next.*.txt
          cp -R out/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r -d '' file; do
            git add -f -- "${file#out/}"
          done < <(find out -type f -print0)
          git commit -m "Publish Fractal Drift static build [skip ci]" || exit 0
          git push origin main
